<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#040814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sistema" />
  <title>SISTEMA DO JOGADOR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #040814;
      --bg-panel: rgba(8, 18, 38, 0.85);
      --primary: #00e5ff;
      --primary-glow: rgba(0, 229, 255, 0.45);
      --primary-dim: rgba(0, 229, 255, 0.14);
      --text-main: #eaf6ff;
      --text-muted: #7aa2c4;
      --danger: #ff2a55;
      --danger-glow: rgba(255, 42, 85, 0.45);
      --success: #00ff9d;
      --gold: #ffcc33;
      --border: rgba(0, 229, 255, 0.3);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body.monarch-mode {
      --bg-dark: #090314;
      --bg-panel: rgba(22, 8, 42, 0.88);
      --primary: #b54cff;
      --primary-glow: rgba(181, 76, 255, 0.55);
      --primary-dim: rgba(181, 76, 255, 0.16);
      --border: rgba(181, 76, 255, 0.4);
    }

    body.punishment-mode {
      --bg-dark: #140308;
      --bg-panel: rgba(38, 6, 14, 0.9);
      --primary: #ff2a55;
      --primary-glow: rgba(255, 42, 85, 0.55);
      --primary-dim: rgba(255, 42, 85, 0.18);
      --border: rgba(255, 42, 85, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.4s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, var(--primary-dim), transparent 60%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      padding: calc(14px + var(--safe-top)) 14px calc(88px + var(--safe-bottom));
    }

    /* Header */
    .sys-header {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      box-shadow: 0 0 20px var(--primary-dim), inset 0 0 18px rgba(0,0,0,0.5);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }

    .sys-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .sys-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .sys-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--primary-dim);
      color: var(--primary);
      letter-spacing: 1px;
    }

    .progress-wrap {
      margin-top: 6px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #ffffff);
      box-shadow: 0 0 12px var(--primary-glow);
      transition: width 0.35s ease;
    }

    /* Tabs */
    .tab-view {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .tab-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Panels */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 0 18px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Missions */
    .mission-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .mission-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .mission-item:hover {
      border-color: var(--border);
      background: var(--primary-dim);
    }

    .mission-item.done {
      border-color: rgba(0, 255, 157, 0.45);
      background: rgba(0, 255, 157, 0.08);
    }

    .mission-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .mission-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--primary);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 900;
      color: #040814;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .mission-item.done .mission-check {
      background: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
    }

    .mission-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .mission-item.done .mission-name {
      text-decoration: line-through;
      opacity: 0.72;
    }

    .mission-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .mission-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      padding: 3px 7px;
      border-radius: 5px;
      background: rgba(255,255,255,0.06);
      color: var(--primary);
      white-space: nowrap;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--primary);
      background: var(--primary-dim);
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn:hover {
      background: var(--primary);
      color: #040814;
      box-shadow: 0 0 18px var(--primary-glow);
    }

    .btn-danger {
      border-color: var(--danger);
      background: rgba(255, 42, 85, 0.14);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 18px var(--danger-glow);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Hunter Profile */
    .hunter-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px 0 14px;
    }

    .avatar-ring {
      width: 126px;
      height: 126px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      box-shadow: 0 0 25px var(--primary-glow), inset 0 0 20px var(--primary-dim);
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      background: radial-gradient(circle, var(--primary-dim), rgba(0,0,0,0.75));
      overflow: hidden;
    }

    .hunter-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .hunter-rank {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      color: var(--primary);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Characters Tab */
    .char-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .char-card {
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 13px;
      transition: all 0.25s ease;
    }

    .char-card.equipped {
      border-color: var(--primary);
      background: var(--primary-dim);
      box-shadow: 0 0 18px var(--primary-dim);
    }

    .char-avatar {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.45);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .char-info {
      flex: 1;
      min-width: 0;
    }

    .char-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .char-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .char-rank-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: var(--gold);
      border: 1px solid rgba(255, 204, 51, 0.35);
      white-space: nowrap;
    }

    .char-role {
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .char-quote {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 9px;
    }

    .btn-equip {
      padding: 7px 12px;
      font-size: 0.72rem;
      width: auto;
    }

    /* History */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      font-size: 0.9rem;
    }

    .history-status.ok { color: var(--success); font-weight: 700; }
    .history-status.fail { color: var(--danger); font-weight: 700; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: rgba(4, 10, 22, 0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 8px 10px calc(8px + var(--safe-bottom));
    }

    .bottom-nav-inner {
      max-width: 680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 10px;
      padding: 8px 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .nav-btn span.icon {
      font-size: 1.15rem;
    }

    .nav-btn.active {
      color: var(--primary);
      border-color: var(--border);
      background: var(--primary-dim);
      box-shadow: 0 0 12px var(--primary-dim);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: var(--bg-panel);
      border: 1px solid var(--primary);
      color: var(--text-main);
      padding: 11px 18px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 1px;
      box-shadow: 0 0 20px var(--primary-glow);
      z-index: 50;
      transition: transform 0.3s ease;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="toast" class="toast">SISTEMA ATUALIZADO</div>

  <div class="app-shell">
    <!-- Cabeçalho do Sistema -->
    <header class="sys-header">
      <div class="sys-header-top">
        <div class="sys-title">[ SISTEMA ]</div>
        <div class="sys-badges">
          <div class="badge" id="hdr-level">NV. 1</div>

      <div class="progress-wrap">

          <span id="hdr-streak">Dias Perfeitos: 0/7</span>
          <span id="hdr-progress-text">0/17 Missões</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="hdr-progress-fill"></div>
        </div>
      </div>
    </header>

    <!-- ABA 1: MISSÕES -->
    <section id="tab-missions" class="tab-view active">
      <div class="panel">
        <div class="panel-title">
          <span>MISSÕES DIÁRIAS</span>
          <span id="mission-mode-label">MODO NORMAL</span>
        </div>
        <div class="mission-list" id="mission-list"></div>
      </div>
      <button class="btn" id="btn-finish-day">FINALIZAR DIA</button>
    </section>

    <!-- ABA 2: CAÇADOR -->
    <section id="tab-hunter" class="tab-view">
      <div class="panel">
        <div class="panel-title">
          <span>STATUS DO CAÇADOR</span>
          <span id="hunter-days-total">0 DIAS</span>
        </div>
        <div class="hunter-hero">
          <div class="avatar-ring" id="hunter-avatar"></div>
          <div class="hunter-name" id="hunter-name">SUNG JIN-WOO</div>
          <div class="hunter-rank" id="hunter-rank-title">RANK E • CAÇADOR INICIANTE</div>
        </div>
        <div class="stats-grid" id="stats-grid"></div>
      </div>

      <div class="panel">
        <div class="panel-title"><span>DIAGNÓSTICO DO SISTEMA</span></div>
        <p id="hunter-diagnosis" style="color: var(--text-muted); line-height: 1.5; font-size: 0.95rem;"></p>
      </div>
    </section>

    <!-- ABA 3: PERSONAGENS DO ANIME -->
    <section id="tab-characters" class="tab-view">
      <div class="panel">
        <div class="panel-title">
          <span>PERSONAGENS • SOLO LEVELING</span>
          <span id="char-count">8 DISPONÍVEIS</span>
        </div>
        <div class="char-grid" id="char-grid"></div>
      </div>
    </section>

    <!-- ABA 4: HISTÓRICO -->
    <section id="tab-history" class="tab-view">
      <div class="panel">
        <div class="panel-title"><span>REGISTRO DE DIAS</span></div>
        <div class="history-list" id="history-list"></div>
      </div>

      <div class="panel">
        <div class="panel-title"><span>BACKUP & SISTEMA</span></div>
        <div class="btn-row" style="margin-bottom: 10px;">
          <button class="btn" id="btn-export">EXPORTAR JSON</button>
          <button class="btn" id="btn-import">IMPORTAR JSON</button>
        </div>
        <input type="file" id="import-file" accept=".json" style="display:none;" />
        <button class="btn btn-danger" id="btn-reset-system">REINICIAR SISTEMA</button>
      </div>
    </section>
  </div>

  <!-- Navegação Inferior -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-btn active" data-tab="missions">
        <span class="icon">⚔️</span>
        <span>MISSÕES</span>
      </button>
      <button class="nav-btn" data-tab="hunter">
        <span class="icon">🛡️</span>
        <span>CAÇADOR</span>
      </button>
      <button class="nav-btn" data-tab="characters">
        <span class="icon">👥</span>
        <span>PERSONAGENS</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <span class="icon">📜</span>
        <span>HISTÓRICO</span>
      </button>
    </div>
  </nav>

        quote: "Transformação bestial com instinto e força avassaladores.",
        color: "#e2f1ff",
        svg: `<svg viewBox="0 0 100 100" width="64" height="64"><circle cx="50" cy="50" r="44" fill="#101824" stroke="#e2f1ff" stroke-width="3"/><path d="M28 32 L40 44 L34 68 M72 32 L60 44 L66 68" stroke="#e2f1ff" stroke-width="3.5" fill="none"/><circle cx="42" cy="50" r="3.5" fill="#ffcc33"/><circle cx="58" cy="50" r="3.5" fill="#ffcc33"/></svg>`
      },
      {
        id: "gogunhee",
        name: "Go Gun-Hee",
        rank: "RANK S",
        role: "Presidente • Associação de Caçadores",
        quote: "O receptáculo da luz que protege os caçadores com honra.",
        color: "#66d9ff",
        svg: `<svg viewBox="0 0 100 100" width="64" height="64"><circle cx="50" cy="50" r="44" fill="#091a26" stroke="#66d9ff" stroke-width="3"/><polygon points="50,18 62,42 84,50 62,58 50,82 38,58 16,50 38,42" fill="none" stroke="#66d9ff" stroke-width="3"/></svg>`
      },
      {
        id: "thomas",
        name: "Thomas Andre",
        rank: "NACIONAL",
        role: "Golias • Guilda Scavenger",
        quote: "Força física absoluta digna de um Caçador de Nível Nacional.",
        color: "#ffaa00",
        svg: `<svg viewBox="0 0 100 100" width="64" height="64"><circle cx="50" cy="50" r="44" fill="#241604" stroke="#ffaa00" stroke-width="3"/><rect x="30" y="30" width="40" height="40" rx="8" fill="none" stroke="#ffaa00" stroke-width="3.5"/><path d="M38 50 H62 M50 38 V62" stroke="#fff" stroke-width="3.5"/></svg>`
      }
    ];

    const BASE_MISSIONS = [
      { id: "m1", name: "Flexões", base: 10, unit: "reps", scalable: true, stat: "fisico" },
      { id: "m2", name: "Agachamentos", base: 10, unit: "reps", scalable: true, stat: "fisico" },
      { id: "m3", name: "Abdominais", base: 10, unit: "reps", scalable: true, stat: "vitalidade" },
      { id: "m4", name: "Corrida / Caminhada", base: 15, unit: "min", scalable: true, stat: "vitalidade" },
      { id: "m5", name: "Leitura focada", base: 10, unit: "págs", scalable: true, stat: "conhecimento" },
      { id: "m6", name: "Estudo de Inglês", base: 10, unit: "min", scalable: true, stat: "conhecimento" },
      { id: "m7", name: "Beber 2L de água", base: null, unit: "", scalable: false, stat: "vitalidade" },
      { id: "m8", name: "Arrumar a cama", base: null, unit: "", scalable: false, stat: "disciplina" },
      { id: "m9", name: "Organizar ambiente", base: null, unit: "", scalable: false, stat: "disciplina" },
      { id: "m10", name: "Meditação / Respiração", base: 5, unit: "min", scalable: false, stat: "mentalidade" },
      { id: "m11", name: "Zero procrastinação matinal", base: null, unit: "", scalable: false, stat: "disciplina" },
      { id: "m12", name: "Estudar habilidade principal", base: 20, unit: "min", scalable: true, stat: "sabedoria" },
      { id: "m13", name: "Alimentação limpa", base: null, unit: "", scalable: false, stat: "vitalidade" },
      { id: "m14", name: "Sem redes sociais por 2h", base: null, unit: "", scalable: false, stat: "mentalidade" },
      { id: "m15", name: "Boa postura e comunicação", base: null, unit: "", scalable: false, stat: "carisma" },
      { id: "m16", name: "Planejar o dia seguinte", base: null, unit: "", scalable: false, stat: "sabedoria" },
      { id: "m17", name: "Dormir no horário", base: null, unit: "", scalable: false, stat: "mentalidade" }
    ];

    const RANKS = [
      { minLevel: 1, rank: "RANK E", title: "CAÇADOR INICIANTE" },
      { minLevel: 2, rank: "RANK D", title: "SOBREVIVENTE" },
      { minLevel: 3, rank: "RANK C", title: "DESPERTO" },
      { minLevel: 4, rank: "RANK B", title: "ELITE DA GUILDA" },
      { minLevel: 5, rank: "RANK A", title: "COMANDANTE" },
      { minLevel: 6, rank: "RANK S", title: "CAÇADOR NACIONAL" },
      { minLevel: 7, rank: "MONARCA", title: "MONARCA DAS SOMBRAS" }
    ];

    function defaultState() {
      return {
        level: 1,
        streak: 0,
        punishment: false,
        completed: {},
        selectedCharId: "jinwoo",
        stats: {
          fisico: 10,
          conhecimento: 10,
          vitalidade: 10,
          disciplina: 10,
          mentalidade: 10,
          carisma: 10,
          sabedoria: 10
        },
        history: []
      };
    }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        return { ...defaultState(), ...JSON.parse(raw) };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function playBeep(freq = 640, duration = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch {}
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2300);
    }

    function getRankInfo(level) {
      let current = RANKS[0];
      for (const r of RANKS) {
        if (level >= r.minLevel) current = r;
      }
      return current;
    }

    function applyTheme() {
      document.body.classList.remove("monarch-mode", "punishment-mode");
      if (state.punishment) {
        document.body.classList.add("punishment-mode");
      } else if (state.level >= 7) {
        document.body.classList.add("monarch-mode");
      }
    }

    function renderAll() {
      applyTheme();
      renderHeader();
      renderMissions();
      renderHunter();
      renderCharacters();
      renderHistory();
    }

    function renderHeader() {
      const rankInfo = getRankInfo(state.level);
      const doneCount = Object.values(state.completed).filter(Boolean).length;
      const pct = Math.round((doneCount / BASE_MISSIONS.length) * 100);

      document.getElementById("hdr-level").textContent = `NV. ${state.level}`;
      document.getElementById("hdr-rank").textContent = rankInfo.rank;
      document.getElementById("hdr-streak").textContent = `Dias Perfeitos: ${state.streak}/7`;
      document.getElementById("hdr-progress-text").textContent = `${doneCount}/${BASE_MISSIONS.length} Missões`;
      document.getElementById("hdr-progress-fill").style.width = `${pct}%`;
      document.getElementById("mission-mode-label").textContent = state.punishment
        ? "ZONA DE PUNIÇÃO"
        : state.level >= 7
          ? "MONARCA"
          : "MODO NORMAL";
    }

    function renderMissions() {
      const list = document.getElementById("mission-list");
      list.innerHTML = "";

      BASE_MISSIONS.forEach((m) => {
        const isDone = !!state.completed[m.id];
        const amount = m.scalable ? m.base + (state.level - 1) * 5 : m.base;
        const subtitle = amount ? `Meta atual: ${amount} ${m.unit}` : "Meta fixa diária";

        const el = document.createElement("div");
        el.className = `mission-item ${isDone ? "done" : ""}`;
        el.innerHTML = `
          <div class="mission-left">
            <div class="mission-check">${isDone ? "✓" : ""}</div>
            <div>
              <div class="mission-name">${m.name}</div>
              <div class="mission-sub">${subtitle}</div>
            </div>
          </div>
          <span class="mission-tag">+${m.stat.toUpperCase()}</span>
        `;
        el.addEventListener("click", () => {
          state.completed[m.id] = !state.completed[m.id];
          playBeep(state.completed[m.id] ? 780 : 420, 0.06);
          saveState();
          renderHeader();
          renderMissions();
        });
        list.appendChild(el);
      });
    }

    function renderHunter() {
      const rankInfo = getRankInfo(state.level);
      const char = CHARACTERS.find((c) => c.id === state.selectedCharId) || CHARACTERS[0];

      document.getElementById("hunter-avatar").innerHTML = char.svg;
      document.getElementById("hunter-name").textContent = char.name.toUpperCase();
      document.getElementById("hunter-rank-title").textContent = `${rankInfo.rank} • ${rankInfo.title}`;
      document.getElementById("hunter-days-total").textContent = `${state.history.length} DIAS`;

      const labels = {
        fisico: "Físico",
        conhecimento: "Conhecimento",
        vitalidade: "Vitalidade",
        disciplina: "Disciplina",
        mentalidade: "Mentalidade",
        carisma: "Carisma",
        sabedoria: "Sabedoria"
      };

      const grid = document.getElementById("stats-grid");
      grid.innerHTML = Object.entries(state.stats)
        .map(([k, v]) => `
          <div class="stat-card">
            <span class="stat-label">${labels[k]}</span>
            <span class="stat-val">${v}</span>
          </div>
        `)
        .join("");

      const perfectDays = state.history.filter((h) => h.status === "PERFEITO").length;
      document.getElementById("hunter-diagnosis").textContent =
        state.punishment
          ? "ALERTA: Você está na Zona de Punição. Conclua todas as 17 missões hoje para restaurar o equilíbrio do Sistema."
          : `Personagem ativo: ${char.name}. Você acumulou ${perfectDays} dias perfeitos até agora. Mantenha a constância para evoluir seus atributos.`;
    }

    function renderCharacters() {
      const grid = document.getElementById("char-grid");
      grid.innerHTML = "";

      CHARACTERS.forEach((char) => {
        const equipped = state.selectedCharId === char.id;
        const card = document.createElement("div");
        card.className = `char-card ${equipped ? "equipped" : ""}`;
        card.innerHTML = `
          <div class="char-avatar">${char.svg}</div>
          <div class="char-info">
            <div class="char-top">
              <div class="char-name">${char.name}</div>
              <span class="char-rank-pill">${char.rank}</span>
            </div>
            <div class="char-role">${char.role}</div>
            <div class="char-quote">"${char.quote}"</div>
            <button class="btn btn-equip" data-char="${char.id}">
              ${equipped ? "EQUIPADO ✓" : "SELECIONAR AVATAR"}
            </button>
          </div>
        `;
        card.querySelector(".btn-equip").addEventListener("click", () => {
          state.selectedCharId = char.id;
          playBeep(880, 0.08);
          saveState();
          renderHunter();
          renderCharacters();
          showToast(`${char.name.toUpperCase()} EQUIPADO!`);
        });
        grid.appendChild(card);
      });
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      if (!state.history.length) {
        list.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:16px;">Nenhum dia finalizado ainda.</div>`;
        return;
      }
      list.innerHTML = state.history
        .slice()
        .reverse()
        .map((h) => `
          <div class="history-item">
            <div>
              <strong>${h.date}</strong>
              <div style="font-size:0.8rem; color:var(--text-muted);">${h.done}/${BASE_MISSIONS.length} missões • Nv. ${h.level}</div>
            </div>
            <span class="history-status ${h.status === "PERFEITO" ? "ok" : "fail"}">${h.status}</span>
          </div>
        `)
        .join("");
    }

    function bindEvents() {
      // Navegação entre abas
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.dataset.tab;
          document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
          document.querySelectorAll(".tab-view").forEach((v) => v.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(`tab-${target}`).classList.add("active");
          playBeep(520, 0.05);
        });
      });

      // Finalizar dia
      document.getElementById("btn-finish-day").addEventListener("click", () => {
        const doneCount = Object.values(state.completed).filter(Boolean).length;
        const allDone = doneCount === BASE_MISSIONS.length;
        const today = new Date().toLocaleDateString("pt-BR");

        if (allDone) {
          BASE_MISSIONS.forEach((m) => {
            state.stats[m.stat] += 1;
          });
          state.punishment = false;
          state.streak += 1;

          if (state.streak >= 7) {
            state.level += 1;
            state.streak = 0;
            playBeep(980, 0.16);
            showToast(`SUBIU DE NÍVEL! AGORA VOCÊ É NV. ${state.level}`);
          } else {
            playBeep(760, 0.1);
            showToast("DIA PERFEITO CONCLUÍDO! ATRIBUTOS +1");
          }
        } else {
          state.punishment = true;
          state.streak = 0;
          playBeep(220, 0.2);
          showToast("MISSÕES INCOMPLETAS! ZONA DE PUNIÇÃO ATIVADA");
        }

        state.history.push({
          date: today,
          done: doneCount,
          level: state.level,
          status: allDone ? "PERFEITO" : "PUNIÇÃO"
        });

        state.completed = {};
        saveState();
        renderAll();
      });

      // Exportar JSON
      document.getElementById("btn-export").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "sistema-jogador-backup.json";
        a.click();
        URL.revokeObjectURL(url);
        showToast("BACKUP EXPORTADO!");
      });

      // Importar JSON
      const fileInput = document.getElementById("import-file");
      document.getElementById("btn-import").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            state = { ...defaultState(), ...parsed };
            saveState();
            renderAll();
            showToast("BACKUP IMPORTADO COM SUCESSO!");
          } catch {
            showToast("ARQUIVO JSON INVÁLIDO!");
          }
        };
        reader.readAsText(file);
      });

      // Reiniciar sistema
      document.getElementById("btn-reset-system").addEventListener("click", () => {
        if (confirm("Deseja realmente reiniciar todo o progresso do Sistema?")) {
          state = defaultState();
          saveState();
          renderAll();
          showToast("SISTEMA REINICIADO!");
        }
      });
    }

    bindEvents();
    renderAll();
  </script>
</body>
</html>
